control_node:
  ros__parameters:
    supported_targets: [airpod, coke, tissue, vaseline]

    # Logitech F710 in XInput mode: A=0, X=2, Y=3. B is unused.
    recognition_button_index: 0
    home_button_index: 2
    emergency_button_index: 3

    home_on_startup: true
    home_pose_deg: [0.0, -101.0, 53.0, 70.0]
    recognition_pose_deg: [0.0, -30.0, -41.0, 115.0]
    cargo_pose_deg: [-73.0, -30.0, 38.0, -10.0]
    joint_motion_duration_sec: 4.0
    recognition_settle_sec: 0.5
    release_settle_sec: 0.5
    open_palm_hold_sec: 2.0
    open_palm_max_gap_sec: 0.4

    gripper_open_position: 0.019
    gripper_closed_position: -0.010
    gripper_max_effort: 0.2
    # A stalled CLOSE at or above this joint position means an object is held.
    grasp_position_threshold: -0.008

    # Initial low-speed Pick trial values. Calibrate XYZ on the real robot.
    pick_enabled: true
    pick_calibration_xyz_m: [0.02, 0.0, 0.0]  # 2 cm farther along base_link X
    pregrasp_offset_xyz_m: [0.0, 0.0, 0.05]  # descend 5 cm
    retreat_offset_xyz_m: [0.0, 0.0, 0.15]   # maximum requested lift; partial paths are used

    move_group_name: arm
    base_frame: base_link
    end_effector_link: end_effector_link
    pick_orientation_xyzw: [0.0, 0.7071068, 0.0, 0.7071068]
    # The installed KDL solver uses position_only_ik: true.
    use_orientation_constraint: false
    position_tolerance_m: 0.01
    orientation_tolerance_deg: 50.0
    moveit_planning_time_sec: 3.0
    moveit_velocity_scale: 0.10
    moveit_acceleration_scale: 0.10
    retreat_cartesian_step_m: 0.005  # 5 mm spacing along the vertical lift
    retreat_joint_jump_rad: 0.35    # reject abrupt joint changes
    action_server_timeout_sec: 10.0
    action_result_timeout_sec: 20.0
    # Includes a possible first-use CUDA backend warm-up in VisionNode2.
    vision_result_timeout_sec: 60.0
