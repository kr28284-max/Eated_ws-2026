[global_config]
  title_transmit_bg_color = "#204a87"
[keybindings]
[profiles]
  [[default]]
    background_color = "#1e1e1e"
    cursor_color = "#ffffff"
    font = Monospace 9
    foreground_color = "#eeeeec"
    scrollback_infinite = True
    exit_action = hold
    use_system_font = False
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = Terminal
      parent = window0
  [[eated]]
    [[[window0]]]
      type = Window
      parent = ""
      order = 0
    [[[root_vertical]]]
      type = VPaned
      parent = window0
      order = 0
      ratio = 0.333333
    [[[row1]]]
      type = HPaned
      parent = root_vertical
      order = 0
      ratio = 0.333333
    [[[row1_right]]]
      type = HPaned
      parent = row1
      order = 1
      ratio = 0.5
    [[[terminal1]]]
      type = Terminal
      parent = row1
      order = 0
      profile = default
      title = 1. HARDWARE
      directory = /home/fcsl/eated_ws
      command = bash /home/fcsl/eated_ws/eated_pane.sh 1
    [[[terminal2]]]
      type = Terminal
      parent = row1_right
      order = 0
      profile = default
      title = 2. MOVEIT
      directory = /home/fcsl/eated_ws
      command = bash /home/fcsl/eated_ws/eated_pane.sh 2
    [[[terminal3]]]
      type = Terminal
      parent = row1_right
      order = 1
      profile = default
      title = 3. REALSENSE
      directory = /home/fcsl/eated_ws
      command = bash /home/fcsl/eated_ws/eated_pane.sh 3
    [[[lower_vertical]]]
      type = VPaned
      parent = root_vertical
      order = 1
      ratio = 0.5
    [[[row2]]]
      type = HPaned
      parent = lower_vertical
      order = 0
      ratio = 0.333333
    [[[row2_right]]]
      type = HPaned
      parent = row2
      order = 1
      ratio = 0.5
    [[[terminal4]]]
      type = Terminal
      parent = row2
      order = 0
      profile = default
      title = 4. VISION
      directory = /home/fcsl/eated_ws
      command = bash /home/fcsl/eated_ws/eated_pane.sh 4
    [[[terminal5]]]
      type = Terminal
      parent = row2_right
      order = 0
      profile = default
      title = 5. JOY DRIVER
      directory = /home/fcsl/eated_ws
      command = bash /home/fcsl/eated_ws/eated_pane.sh 5
    [[[terminal6]]]
      type = Terminal
      parent = row2_right
      order = 1
      profile = default
      title = 6. JOYSTICK CONTROL
      directory = /home/fcsl/eated_ws
      command = bash /home/fcsl/eated_ws/eated_pane.sh 6
    [[[row3]]]
      type = HPaned
      parent = lower_vertical
      order = 1
      ratio = 0.333333
    [[[row3_right]]]
      type = HPaned
      parent = row3
      order = 1
      ratio = 0.5
    [[[terminal7]]]
      type = Terminal
      parent = row3
      order = 0
      profile = default
      title = 7. CONTROL NODE
      directory = /home/fcsl/eated_ws
      command = bash /home/fcsl/eated_ws/eated_pane.sh 7
    [[[terminal8]]]
